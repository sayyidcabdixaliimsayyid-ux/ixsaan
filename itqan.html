<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدارس الإتقان — لوحة التحكم</title>
<style>
*{box-sizing:border-box}
:root{--gold:#c9a04a;--green:#1b6b3a;--dark:#123d24;--cream:#fbf7ee}
body{margin:0;font-family:Tahoma,Cairo,sans-serif;color:#2a1d0a;min-height:100vh;
  background:
    radial-gradient(circle at 20% 10%,rgba(201,160,74,.18),transparent 40%),
    radial-gradient(circle at 80% 90%,rgba(27,107,58,.18),transparent 40%),
    var(--cream);
  overflow-x:hidden}
.pattern{position:fixed;inset:-50%;z-index:-1;pointer-events:none;opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><g fill='none' stroke='%23c9a04a' stroke-opacity='.35' stroke-width='1.2'><path d='M45 0 L63 18 L90 18 L72 45 L90 72 L63 72 L45 90 L27 72 L0 72 L18 45 L0 18 L27 18 Z'/><path d='M45 18 L63 45 L45 72 L27 45 Z'/><circle cx='45' cy='45' r='6'/></g></svg>");
  background-size:90px 90px;animation:drift 60s linear infinite}
@keyframes drift{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* الترويسة */
.header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:linear-gradient(120deg,var(--dark),var(--green));color:#fff;padding:14px 20px;
  box-shadow:0 6px 18px rgba(0,0,0,.15);position:relative;overflow:hidden}
.header::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
  transform:translateX(-100%);animation:shine 6s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.logoBox{background:#fff;border-radius:16px;padding:6px 10px;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:float 4s ease-in-out infinite;display:block}
.logoBox img{height:70px;display:block}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.title{text-align:center;flex:1;min-width:200px;position:relative;z-index:1}
.title h1{margin:0;font-size:26px;font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.3)}
.title .sub{font-size:13px;opacity:.9;margin-top:2px}

/* الشريط الذهبي */
.ticker{background:var(--gold);color:var(--dark);overflow:hidden;white-space:nowrap;padding:8px 0;font-weight:700}
.ticker-track{display:inline-block;padding-left:100%;animation:scroll 30s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.ticker .sep{margin:0 26px;color:var(--green)}

/* الترحيب */
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px}
.who{font-size:17px;font-weight:800;color:var(--dark)}
.role{font-size:13px;color:#6b5a3e}
.logout{background:#b3261e;color:#fff;border:0;border-radius:10px;padding:9px 18px;font:inherit;cursor:pointer}

/* بطاقات الإحصاء */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:0 20px}
.stat{background:rgba(255,255,255,.9);border:1px solid #e8d3a2;border-radius:16px;padding:14px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.06);animation:fadeUp .6s ease both}
.stat .n{font-size:28px;font-weight:900;color:var(--green)}
.stat .t{font-size:13px;color:#6b5a3e}

/* الأزرار الملونة */
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:18px 20px 6px}
.tile{position:relative;display:block;width:100%;border:0;font:inherit;text-align:right;cursor:pointer;color:#fff;border-radius:20px;padding:20px 18px;min-height:112px;overflow:hidden;
  box-shadow:0 8px 18px rgba(0,0,0,.14);transition:transform .25s ease,box-shadow .25s ease;animation:fadeUp .6s ease both}
.tile:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 16px 28px rgba(0,0,0,.2)}
.tile::before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><path d='M20 0 L26 14 L40 20 L26 26 L20 40 L14 26 L0 20 L14 14 Z' fill='none' stroke='%23ffffff' stroke-opacity='.12'/></svg>");opacity:.8}
.tile::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);transition:left .7s ease}
.tile:hover::after{left:125%}
.tile>*{position:relative;z-index:1}
.tile .ic{font-size:30px;display:block;margin-bottom:4px;animation:bob 2.8s ease-in-out infinite}
.tile .tt{font-size:17px;font-weight:800;display:block}
.tile .ds{font-size:12px;opacity:.92;display:block}
.tile.on{outline:4px solid #f7d27a;outline-offset:3px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.c-orange{background:linear-gradient(135deg,#e5572a,#f7941d)}
.c-green{background:linear-gradient(135deg,#1b6b3a,#2f9e5a)}
.c-blue{background:linear-gradient(135deg,#0b5c9a,#2196d3)}
.c-gold{background:linear-gradient(135deg,#a86a00,#e0a526)}
.c-dark{background:linear-gradient(135deg,#4a3a2a,#7a5c3a)}
.c-purple{background:linear-gradient(135deg,#5b3a8c,#8e62c9)}
.c-teal{background:linear-gradient(135deg,#0f6e66,#1fa597)}
.c-red{background:linear-gradient(135deg,#8c2030,#c8404f)}

/* المحتوى */
.page{padding:12px 20px 40px}
.card{background:rgba(255,255,255,.95);border:1px solid #e8d3a2;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 6px 16px rgba(0,0,0,.06);animation:fadeUp .5s ease both}
.card h3{margin:0 0 10px;color:var(--green);font-weight:900}
.pickRow{background:rgba(255,255,255,.95);border:2px solid var(--green);border-radius:16px;padding:12px 14px;margin:12px 0}
input,select{font:inherit;padding:10px;border:1px solid #e8d3a2;border-radius:12px;box-sizing:border-box;margin:3px 0;background:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>input,.row>select{flex:1 1 150px}
.row>label{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:700;color:var(--dark)}
button.b{font:inherit;font-weight:800;background:linear-gradient(135deg,#e5572a,#f7941d);color:#fff;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;box-shadow:0 4px 10px rgba(229,87,42,.25)}
button.b:hover{transform:translateY(-1px)}
button.b.g{background:linear-gradient(135deg,#1b6b3a,#2f9e5a);box-shadow:0 4px 10px rgba(27,107,58,.25)}
button.b.m{background:linear-gradient(135deg,#7a5c3a,#a88a5c)}
button.b.r{background:linear-gradient(135deg,#8c2030,#c8404f)}
.back{background:#fff;color:var(--green);border:2px solid var(--green);border-radius:12px;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer;margin-bottom:10px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.05)}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid #f0e4c4;vertical-align:middle}
th{background:linear-gradient(120deg,#123d24,#1b6b3a);color:#fff;font-weight:800}
tr:nth-child(even) td{background:#fdfaf2}
.tw{overflow-x:auto}
.ok{color:#1b6b3a;font-weight:800}
.bad{color:#b3261e;font-weight:800}
.grp{background:linear-gradient(90deg,#fbf0d4,#fbf7ee);border-right:6px solid var(--gold);padding:10px 14px;margin:16px 0 8px;border-radius:12px;font-weight:900;color:var(--dark);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{color:#b3261e;font-weight:800;min-height:20px;margin:6px 0}
.note{color:#6b5a3e;font-size:13px}
.hidden{display:none!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* شاشة الدخول */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:18px}
#login .logoBox img{height:120px}
.loginCard{background:rgba(255,255,255,.95);border-radius:22px;padding:26px;width:100%;max-width:420px;box-shadow:0 14px 34px rgba(0,0,0,.14);animation:fadeUp .7s ease both}
.loginCard h2{text-align:center;color:var(--green);margin:4px 0 14px;font-weight:900}
.loginCard input{width:100%;padding:12px;margin:6px 0}
.loginCard button{width:100%;font:inherit;font-weight:800;background:linear-gradient(135deg,#e5572a,#f7941d);color:#fff;border:0;border-radius:12px;padding:12px;cursor:pointer;margin-top:8px}

.binfo{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bphoto{width:150px;height:105px;object-fit:cover;border-radius:14px;border:2px solid #c9a04a;flex:none}
.bphoto.ph{display:flex;align-items:center;justify-content:center;font-size:40px;background:#fbf6e9}
/* شعار المنظمة: زر الرجوع، يتحرك ويلمع */
.ihsanLink{position:relative;display:inline-block;overflow:hidden;border-radius:8px;perspective:300px;vertical-align:middle}
.ihsanImg{display:block;animation:ihsanLogoFx 5s infinite ease-in-out;backface-visibility:hidden}
.ihsanLink::after{content:"";position:absolute;top:-10%;bottom:-10%;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.9),transparent);transform:skewX(-20deg);animation:ihsanBeam 5s infinite;pointer-events:none}
@keyframes ihsanLogoFx{
0%,100%{transform:translateX(0) rotateY(360deg) scale(1);opacity:1;filter:none}
8%{transform:translateX(-14px) rotateY(180deg);opacity:1;filter:none}
16%{transform:translateX(0) rotateY(360deg);opacity:1}
24%{transform:translateY(0) rotateY(360deg) scale(1);opacity:1}
34%{transform:translateY(18px) rotateY(360deg) scaleY(.3);opacity:0;filter:blur(8px)}
44%{transform:translateY(18px) rotateY(360deg) scaleY(.3);opacity:0;filter:blur(8px)}
56%{transform:translateY(0) rotateY(360deg) scale(1.06);opacity:1;filter:blur(0)}
62%{transform:translateY(0) rotateY(360deg) scale(1);opacity:1;filter:none}
}
@keyframes ihsanBeam{0%,60%{left:-60%}80%,100%{left:120%}}
</style>
</head>
<body>
<div class="pattern"></div>

<div id="gate">
  <div id="login">
    <div class="logoBox"><img src="logo.png" alt="شعار معهد الإحسان"></div>
    <div class="loginCard">
      <h2>أهلاً بكم في نظام مدارس الإتقان</h2>
      <input id="gEmail" type="email" placeholder="البريد الإلكتروني">
      <input id="gPass" type="password" placeholder="كلمة المرور">
      <button onclick="login()">دخول</button>
      <div id="gateMsg" class="msg"></div>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="header">
    <div class="logoBox"><img src="quran-logo.png" onerror="this.onerror=null;this.src='ihsan-logo.png'" alt="شعار الجمعية القرآنية" style="height:70px;display:block"></div>
    <div class="title">
      <h1>الجمعية القرآنية في كينيا</h1>
      <div class="sub">منظمة الإحسان للرعاية الاجتماعية</div>
    </div>
    <a href="index.html" class="logoBox ihsanLink" title="العودة إلى موقع المنظمة" style="padding:6px 10px"><img class="ihsanImg" src="ihsan-logo.png" alt="منظمة الإحسان" style="height:56px;display:block;background:#fff;border-radius:8px;padding:4px"></a>
  </div>

  <div class="ticker"><div class="ticker-track">قال تعالى: ﴿إن هذا القرآن يهدي للتي هي أقوم﴾ <span class="sep">✦</span> تعليم قرآني فريد <span class="sep">✦</span> مدارس رائدة <span class="sep">✦</span> مسابقات <span class="sep">✦</span> وكوادر ملهمة <span class="sep">✦</span></div></div>

  <div class="bar">
    <div>
      <div class="who" id="who"></div>
    </div>
    <button id="outBtn" class="logout hidden" onclick="logout()">خروج</button>
  </div>

  <div id="stats" class="stats"></div>
  <div id="tabs" class="menu"></div>
  <div class="page">
    <div id="pick" class="pickRow hidden"></div>
    <div id="msg" class="msg"></div>
    <div id="content"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://tmhfjnqujgmwayktsbnd.supabase.co';
const SUPABASE_KEY='sb_publishable_CZiS1VnVdN3hnc9YT1k4wg_0uE7yNmL';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ROLE_LABEL={itqan_association_manager:'مدير الجمعية',itqan_branch_manager:'مدير الفرع',itqan_cashier:'أمين الصندوق'};
const KIND={rw:'حلقة القراءة والكتابة',quran:'حلقة قرآن'};
const GN={boy:'بنين',girl:'بنات'};
const TABS={
  association:[['branches','مدارس الاتقان لتحفيظ القرآن','c-green','🏫','الفروع وحلقاتها وطلابها'],['addbranch','إدارة فرع','c-blue','🛠️','بيانات الفروع وإضافة فرع'],['halaqat','الحلقات والطلاب','c-teal','📚','الحلقات حسب الفرز'],['register','تسجيل وقبول','c-orange','📝','استمارة طالب جديد'],['progress','المتابعة','c-purple','📈','الحفظ والقراءة والكتابة'],['finance','المالية ومتابعتها','c-red','💰','السداد والمتأخرات'],['people','بيانات المدراء والمعلمين','c-gold','👥','المدراء والمعلمون'],['reports','تقارير شاملة','c-dark','📊','ملخص كل الفروع']],
  branch:[['register','تسجيل وقبول','c-orange','📝','استمارة طالب جديد'],['halaqat','الحلقات','c-teal','📚','الحلقات والطلاب'],['progress','المتابعة','c-purple','📈','الحفظ والقراءة والكتابة'],['finance','المالية','c-red','💰','السداد والمتأخرات'],['people','المعلمون','c-gold','👥','إضافة المعلمين']],
  cashier:[['finance','المالية','c-red','💰','السداد والمتأخرات']]
};
const BRANCH_TABS=['halaqat','register','progress','finance','people'];
const DEFAULT_TAB={association:'branches',branch:'halaqat',cashier:'finance'};

let ME=null, BR=[], TE=[], HA=[], ST=[], PY=[], PEOPLE=[];
const monthNow=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const V={tab:'',branch:'',fh:'all',ft:'all',fg:'all',group:'halaqa',month:monthNow()};

const rk=()=>ME.role==='itqan_association_manager'?'association':ME.role==='itqan_branch_manager'?'branch':'cashier';
const scope=()=>rk()==='association'?V.branch:ME.branch_id;
const brOf=id=>BR.find(b=>b.id===id);
const haOf=id=>HA.find(h=>h.id===id);
const teName=id=>TE.find(t=>t.id===id)?.full_name||'—';
const msg=(t,ok)=>{$('msg').className=ok?'ok':'msg';$('msg').textContent=t};
const isPaid=sid=>PY.some(p=>p.student_id===sid&&p.month===V.month);
const setV=(k,v)=>{V[k]=v;paint()};
const go=t=>{V.tab=t;paint()};
const openBranch=id=>{V.branch=id;V.fh='all';V.ft='all';V.tab='halaqat';paint()};
const chBranch=v=>{V.branch=v;V.fh='all';V.ft='all';paint()};
const noB=()=>'<div class="card note">أضف فرعاً أولاً من تبويب «إضافة فرع».</div>';

function filtered(bid){
  return ST.filter(s=>s.branch_id===bid
    &&(V.fh==='all'||s.halaqa_id===V.fh)
    &&(V.ft==='all'||haOf(s.halaqa_id)?.teacher_id===V.ft)
    &&(V.fg==='all'||s.gender===V.fg));
}

/* ===== الدخول والتحميل ===== */
async function login(){
  const {error}=await db.auth.signInWithPassword({email:$('gEmail').value.trim(),password:$('gPass').value});
  if(error){$('gateMsg').textContent='البريد أو كلمة المرور غير صحيحة';return}
  enter();
}

async function enter(){
  const {data:{user}}=await db.auth.getUser();
  if(!user) return;
  const {data:prof,error}=await db.from('profiles').select('full_name,role,branch_id,all_panels').eq('id',user.id).single();
  if(prof&&prof.all_panels) prof.role='itqan_association_manager';
  if(error||!prof||!ROLE_LABEL[prof.role]){
    $('gateMsg').textContent='هذا الحساب غير مرتبط بمدارس الإتقان';
    await db.auth.signOut();return;
  }
  ME=prof;
  $('gate').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('outBtn').classList.remove('hidden');
  $('who').textContent='مرحباً، '+prof.full_name+' — '+ROLE_LABEL[prof.role];
  V.branch=rk()==='association'?'':ME.branch_id;
  await loadAll();
  if(rk()==='association'&&BR.length) V.branch=BR[0].id;
  V.tab=DEFAULT_TAB[rk()];
  paint();
}

async function loadAll(){
  const q=[
    db.from('itqan_branches').select('*').order('sort_order'),
    db.from('itqan_teachers').select('*').order('full_name').range(0,9999),
    db.from('itqan_halaqat').select('*').order('name').range(0,9999),
    db.from('itqan_students').select('*').order('full_name').range(0,9999),
    db.from('itqan_payments').select('*').range(0,9999)
  ];
  if(rk()==='association') q.push(db.from('profiles').select('id,full_name,role,branch_id').in('role',Object.keys(ROLE_LABEL)));
  const r=await Promise.all(q);
  const bad=r.find(x=>x.error);
  if(bad) msg('تعذّر التحميل: '+bad.error.message);
  BR=r[0].data||[]; TE=r[1].data||[]; HA=r[2].data||[]; ST=r[3].data||[]; PY=r[4].data||[];
  PEOPLE=r[5]?.data||[];
}

async function dbDo(p,ok){
  const {error}=await p;
  if(error){msg('تعذّر: '+error.message);return}
  await loadAll();
  msg(ok||'تم ✓',true);
  paint();
}

/* ===== الرسم ===== */
function paint(){
  if(!ME) return;
  const k=rk();
  if(!TABS[k].some(t=>t[0]===V.tab)) V.tab=DEFAULT_TAB[k];
  $('tabs').innerHTML=TABS[k].map(([id,n,c,ic,ds])=>`<button class="tile ${c} ${V.tab===id?'on':''}" onclick="go('${id}')"><span class="ic">${ic}</span><span class="tt">${n}</span><span class="ds">${ds}</span></button>`).join('');
  $('stats').innerHTML=statsHtml();
  const needs=BRANCH_TABS.includes(V.tab);
  $('pick').innerHTML=needs?pickerHtml():'';
  $('pick').classList.toggle('hidden',!needs);
  const info=needs&&scope()?branchInfo():'';
  $('content').innerHTML=info+(RV[V.tab]?RV[V.tab]():'');
}

function statsHtml(){
  const b=scope();
  const ss=b?ST.filter(s=>s.branch_id===b):ST;
  const cards=[
    [rk()==='association'&&!b?BR.length:ss.length, rk()==='association'&&!b?'عدد الفروع':'إجمالي الطلاب'],
    [ss.filter(s=>s.gender==='boy').length,'بنين'],
    [ss.filter(s=>s.gender==='girl').length,'بنات'],
    [b?HA.filter(h=>h.branch_id===b).length:HA.length,'الحلقات'],
    [b?TE.filter(t=>t.branch_id===b).length:TE.length,'المعلمون'],
    [ss.filter(s=>isPaid(s.id)).length,'سدّد هذا الشهر']
  ];
  return cards.map(([n,t])=>`<div class="stat"><div class="n">${n}</div><div class="t">${t}</div></div>`).join('');
}

function pickerHtml(){
  const assoc=rk()==='association', b=scope();
  const hs=HA.filter(h=>h.branch_id===b), ts=TE.filter(t=>t.branch_id===b);
  let h='';
  if(assoc) h+=`<div class="row"><label>الفرع: <select onchange="chBranch(this.value)">${BR.map(x=>`<option value="${x.id}" ${x.id===b?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div>`;
  if(['halaqat','progress','finance'].includes(V.tab)){
    h+=`<div class="row" style="margin-top:8px">
      <label>الحلقة: <select onchange="setV('fh',this.value)"><option value="all">الكل</option>${hs.map(x=>`<option value="${x.id}" ${V.fh===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
      <label>المعلم: <select onchange="setV('ft',this.value)"><option value="all">الكل</option>${ts.map(t=>`<option value="${t.id}" ${V.ft===t.id?'selected':''}>${esc(t.full_name)}</option>`).join('')}</select></label>
      <label>الجنس: <select onchange="setV('fg',this.value)"><option value="all">الكل</option><option value="boy" ${V.fg==='boy'?'selected':''}>بنين</option><option value="girl" ${V.fg==='girl'?'selected':''}>بنات</option></select></label>
      ${V.tab==='halaqat'?`<label>التجميع: <select onchange="setV('group',this.value)">${[['halaqa','حسب الحلقة'],['teacher','حسب المعلم'],['gender','حسب الجنس']].map(([k,n])=>`<option value="${k}" ${V.group===k?'selected':''}>${n}</option>`).join('')}</select></label>`:''}
      ${V.tab==='finance'?`<label>الشهر: <input type="month" value="${V.month}" onchange="setV('month',this.value)"></label>`:''}
    </div>`;
  }
  return h;
}

function rowsOf(list){
  if(!list.length) return '<p class="note">لا يوجد طلاب</p>';
  return `<div class="tw"><table><tr><th>الطالب</th><th>الجنس</th><th>ولي الأمر</th><th>الهاتف</th><th>الحلقة (تغيير)</th><th>المعلم</th></tr>${list.map(s=>{
    const hh=haOf(s.halaqa_id);
    return `<tr><td>${esc(s.full_name)}</td><td>${GN[s.gender]}</td><td>${esc(s.guardian_name||'')}</td><td>${esc(s.phone||'')}</td>
    <td><select onchange="moveStudent('${s.id}',this.value)"><option value="">—</option>${HA.filter(x=>x.branch_id===s.branch_id).map(x=>`<option value="${x.id}" ${x.id===s.halaqa_id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></td>
    <td>${esc(teName(hh?.teacher_id))}</td></tr>`;}).join('')}</table></div>`;
}
const grp=(title,list,extra='')=>`<div class="grp"><span>${title}</span>${extra}<span class="note">(${list.length} طالب)</span></div>${rowsOf(list)}`;

/* ===== عروض التبويبات ===== */
const RV={};

RV.branches=()=>BR.length?`<div class="menu" style="padding:0">${BR.map(b=>{const ss=ST.filter(s=>s.branch_id===b.id);return `<button class="tile c-green" onclick="openBranch('${b.id}')"><span class="ic">🏫</span><span class="tt">${esc(b.name)}</span>
  <span class="ds">الحلقات: ${HA.filter(h=>h.branch_id===b.id).length} — المعلمون: ${TE.filter(t=>t.branch_id===b.id).length}</span>
  <span class="ds">الطلاب: ${ss.length} (بنين ${ss.filter(s=>s.gender==='boy').length} / بنات ${ss.filter(s=>s.gender==='girl').length})</span>
  <span class="ds">الرسم الشهري: ${b.monthly_fee}</span></button>`;}).join('')}</div>`:'<div class="card note">لا توجد فروع بعد.</div>';

const bUrl=p=>p?db.storage.from('itqan-media').getPublicUrl(p).data.publicUrl:'';
const bPhoto=b=>b.photo_path?`<img class="bphoto" src="${bUrl(b.photo_path)}" alt="">`:'<div class="bphoto ph">🏫</div>';

function branchInfo(){
  const b=brOf(scope()); if(!b) return '';
  return `<div class="card binfo">${bPhoto(b)}
    <div style="flex:1;min-width:220px"><h3 style="margin:0 0 6px">${esc(b.name)}</h3>
    <div class="note">📍 العنوان: ${esc(b.address||'لم يُحدد بعد')}</div>
    ${b.location_url?`<div class="note"><a href="${esc(b.location_url)}" target="_blank" rel="noopener">فتح الموقع على الخريطة</a></div>`:''}
    <div class="note">الرسم الشهري: ${b.monthly_fee} — رسوم القبول: ${b.admission_fee}</div></div></div>`;
}

RV.addbranch=()=>`${BR.map(b=>`<div class="card binfo" style="flex-direction:column;align-items:stretch">
    <div class="binfo">${bPhoto(b)}<div style="flex:1;min-width:220px"><h3 style="margin:0 0 6px">${esc(b.name)}</h3><div class="note">${esc(b.address||'بدون عنوان')}</div></div></div>
    <div class="row" style="margin-top:10px">
      <input id="bn_${b.id}" value="${esc(b.name)}" placeholder="اسم الفرع">
      <input id="ba_${b.id}" value="${esc(b.address||'')}" placeholder="العنوان">
      <input id="bl_${b.id}" value="${esc(b.location_url||'')}" placeholder="رابط الموقع على الخريطة">
      <input id="bf_${b.id}" type="number" value="${b.monthly_fee}" placeholder="الرسم الشهري">
      <input id="bd_${b.id}" type="number" value="${b.admission_fee}" placeholder="رسوم القبول">
      <label class="note">صورة الفرع: <input type="file" id="bp_${b.id}" accept="image/*"></label>
    </div>
    <div style="margin-top:10px"><button class="b g" onclick="saveBranch('${b.id}')">حفظ بيانات الفرع</button></div></div>`).join('')
  ||'<div class="card note">لا توجد فروع بعد.</div>'}
  <div class="card"><h3>إضافة فرع جديد</h3>
    <div class="row">
      <input id="nbName" placeholder="اسم الفرع، مثال: مدرسة الإتقان — الفرع الخامس">
      <input id="nbAddr" placeholder="العنوان">
      <input id="nbLoc" placeholder="رابط الموقع على الخريطة">
      <input id="nbFee" type="number" placeholder="الرسم الشهري" value="20">
      <input id="nbAdm" type="number" placeholder="رسوم القبول" value="0">
    </div>
    <div style="margin-top:10px"><button class="b g" onclick="addBranch()">حفظ الفرع الجديد</button></div></div>`;

async function uploadBranchPhoto(bid,file){
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  const path=`branches/${bid}/${Date.now()}.${ext}`;
  const {error}=await db.storage.from('itqan-media').upload(path,file,{contentType:file.type||undefined,upsert:false});
  if(error) throw new Error(error.message);
  return path;
}

async function saveBranch(id){
  try{
    const name=$('bn_'+id).value.trim();
    if(!name) return msg('اكتب اسم الفرع');
    const row={name,address:$('ba_'+id).value.trim()||null,location_url:$('bl_'+id).value.trim()||null,
      monthly_fee:+$('bf_'+id).value||0,admission_fee:+$('bd_'+id).value||0};
    const f=$('bp_'+id).files[0];
    if(f) row.photo_path=await uploadBranchPhoto(id,f);
    dbDo(db.from('itqan_branches').update(row).eq('id',id),'تم حفظ بيانات الفرع ✓');
  }catch(e){ msg('تعذّر الحفظ: '+e.message); }
}

function addBranch(){
  const name=$('nbName').value.trim();
  if(!name) return msg('اكتب اسم الفرع');
  const id='itqan-'+Date.now().toString(36);
  dbDo(db.from('itqan_branches').insert({id,name,address:$('nbAddr').value.trim()||null,location_url:$('nbLoc').value.trim()||null,
    monthly_fee:+$('nbFee').value||0,admission_fee:+$('nbAdm').value||0,sort_order:BR.length+1}),'تمت إضافة الفرع ✓');
}

RV.halaqat=()=>{
  const b=scope(); if(!b) return noB();
  const hs=HA.filter(h=>h.branch_id===b), ts=TE.filter(t=>t.branch_id===b), ss=filtered(b);
  let h=`<div class="card"><h3>إضافة حلقة</h3><div class="row">
    <input id="hName" placeholder="اسم الحلقة، مثال: القراءة والكتابة (1)">
    <select id="hKind"><option value="rw">حلقة القراءة والكتابة</option><option value="quran">حلقة قرآن</option></select>
    <select id="hTeacher"><option value="">بدون معلم</option>${ts.map(t=>`<option value="${t.id}">${esc(t.full_name)}</option>`).join('')}</select>
    <input id="hCap" type="number" placeholder="السعة" value="20">
    <button class="b g" onclick="addHalaqa()">إضافة الحلقة</button></div></div>`;
  if(V.group==='halaqa'){
    h+=hs.map(x=>grp(`${esc(x.name)} — ${KIND[x.kind]||''} — ${ss.filter(s=>s.halaqa_id===x.id).length} طالب من ${x.capacity||'—'}`,
      ss.filter(s=>s.halaqa_id===x.id),
      `<select onchange="setTeacher('${x.id}',this.value)"><option value="">بدون معلم</option>${ts.map(t=>`<option value="${t.id}" ${t.id===x.teacher_id?'selected':''}>${esc(t.full_name)}</option>`).join('')}</select>`)).join('')
      ||'<div class="card note">لا توجد حلقات بعد.</div>';
  } else if(V.group==='teacher'){
    h+=ts.map(t=>{const ids=hs.filter(x=>x.teacher_id===t.id).map(x=>x.id);return grp('المعلم: '+esc(t.full_name),ss.filter(s=>ids.includes(s.halaqa_id)));}).join('');
    const ids0=hs.filter(x=>!x.teacher_id).map(x=>x.id);
    h+=grp('بدون معلم',ss.filter(s=>ids0.includes(s.halaqa_id)));
  } else {
    h+=grp('بنين',ss.filter(s=>s.gender==='boy'))+grp('بنات',ss.filter(s=>s.gender==='girl'));
  }
  return h;
};

function addHalaqa(){
  const name=$('hName').value.trim();
  if(!name) return msg('اكتب اسم الحلقة');
  dbDo(db.from('itqan_halaqat').insert({branch_id:scope(),name,kind:$('hKind').value,teacher_id:$('hTeacher').value||null,capacity:+$('hCap').value||20}),'تمت إضافة الحلقة ✓');
}
function moveStudent(id,hid){dbDo(db.from('itqan_students').update({halaqa_id:hid||null}).eq('id',id),'تم نقل الطالب ✓')}
function setTeacher(hid,tid){dbDo(db.from('itqan_halaqat').update({teacher_id:tid||null}).eq('id',hid),'تم تعيين المعلم ✓')}

RV.register=()=>{
  const b=scope(); if(!b) return noB();
  const hs=HA.filter(h=>h.branch_id===b);
  return `<div class="card"><h3>استمارة طالب جديد</h3>
  <div class="row">
    <input id="rName" placeholder="الاسم الرباعي للطالب">
    <select id="rGender"><option value="boy">بنين</option><option value="girl">بنات</option></select>
    <input id="rBirth" type="date" title="تاريخ الميلاد">
    <input id="rGuard" placeholder="اسم ولي الأمر">
    <input id="rPhone" placeholder="هاتف ولي الأمر">
    <input id="rAddr" placeholder="العنوان">
    <select id="rHalaqa"><option value="">— الحلقة لاحقاً —</option>${hs.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>
    <input id="rQuran" placeholder="الحفظ الحالي (مثال: جزء عم)">
    <input id="rRw" placeholder="القراءة والكتابة (مثال: المستوى الأول)">
  </div>
  <label class="note" style="display:flex;gap:6px;margin-top:10px;align-items:center"><input type="checkbox" id="rAdm" style="width:auto"> دفع رسوم القبول</label>
  <div style="margin-top:10px"><button class="b g" onclick="registerStudent()">حفظ الطالب</button></div>
  <p class="note">بعد الحفظ يظهر الطالب في الحلقة المختارة وفي المتابعة والمالية.</p></div>`;
};

function registerStudent(){
  const name=$('rName').value.trim();
  if(!name) return msg('اكتب اسم الطالب');
  const row={
    branch_id:scope(), full_name:name, gender:$('rGender').value,
    birth_date:$('rBirth').value||null,
    guardian_name:$('rGuard').value.trim()||null,
    phone:$('rPhone').value.trim()||null,
    address:$('rAddr').value.trim()||null,
    halaqa_id:$('rHalaqa').value||null,
    admission_paid:$('rAdm').checked,
    quran_progress:$('rQuran').value.trim()||null,
    rw_progress:$('rRw').value.trim()||null,
    progress_updated_at:new Date().toISOString()
  };
  dbDo(db.from('itqan_students').insert(row),'تم تسجيل الطالب ✓');
}

RV.progress=()=>{
  const b=scope(); if(!b) return noB();
  const list=filtered(b);
  if(!list.length) return '<div class="card note">لا يوجد طلاب بهذا الفرز.</div>';
  return `<div class="tw"><table><tr><th>الطالب</th><th>الحلقة</th><th>المعلم</th><th>الحفظ (القرآن)</th><th>القراءة والكتابة</th><th></th></tr>
  ${list.map(s=>{const hh=haOf(s.halaqa_id);return `<tr>
    <td>${esc(s.full_name)}<div class="note">${GN[s.gender]}</div></td>
    <td>${esc(hh?.name||'—')}</td>
    <td>${esc(teName(hh?.teacher_id))}</td>
    <td><input id="q_${s.id}" value="${esc(s.quran_progress||'')}"></td>
    <td><input id="r_${s.id}" value="${esc(s.rw_progress||'')}"></td>
    <td><button class="b g" onclick="saveProgress('${s.id}')">حفظ</button></td></tr>`;}).join('')}</table></div>`;
};

function saveProgress(id){
  dbDo(db.from('itqan_students').update({
    quran_progress:$('q_'+id).value.trim()||null,
    rw_progress:$('r_'+id).value.trim()||null,
    progress_updated_at:new Date().toISOString()
  }).eq('id',id),'تم حفظ المتابعة ✓');
}

RV.finance=()=>{
  const b=brOf(scope()); if(!b) return noB();
  const canEdit=ME.role!=='itqan_cashier';
  const list=filtered(b.id);
  const paidN=list.filter(s=>isPaid(s.id)).length;
  const coll=PY.filter(p=>p.month===V.month&&list.some(s=>s.id===p.student_id)).reduce((a,p)=>a+Number(p.amount||0),0);
  return `<div class="card"><div class="row"><b>الرسم الشهري: ${b.monthly_fee}</b><b>رسوم القبول: ${b.admission_fee}</b>
    <span class="ok">سدّد هذا الشهر: ${paidN} من ${list.length}</span><span>المحصّل: ${coll}</span></div></div>
  <div class="tw"><table><tr><th>الطالب</th><th>الجنس</th><th>الحلقة</th><th>رسوم القبول</th><th>سداد الشهر ${V.month}</th></tr>
  ${list.map(s=>{const pd=isPaid(s.id);return `<tr>
    <td>${esc(s.full_name)}</td><td>${GN[s.gender]}</td><td>${esc(haOf(s.halaqa_id)?.name||'—')}</td>
    <td>${canEdit?`<button class="b ${s.admission_paid?'g':'m'}" onclick="toggleAdm('${s.id}',${!s.admission_paid})">${s.admission_paid?'مسدّد ✓':'لم يسدّد'}</button>`:(s.admission_paid?'<span class="ok">مسدّد</span>':'<span class="bad">لم يسدّد</span>')}</td>
    <td><span class="${pd?'ok':'bad'}">${pd?'سدّد':'لم يسدّد'}</span> <button class="b ${pd?'m':'g'}" onclick="togglePay('${s.id}')">${pd?'إلغاء السداد':'تسجيل السداد'}</button></td></tr>`;}).join('')
    ||'<tr><td colspan="5" class="note">لا يوجد طلاب</td></tr>'}</table></div>`;
};

function toggleAdm(sid,val){dbDo(db.from('itqan_students').update({admission_paid:val}).eq('id',sid))}

function togglePay(sid){
  const p=PY.find(x=>x.student_id===sid&&x.month===V.month);
  if(p) return dbDo(db.from('itqan_payments').delete().eq('id',p.id),'تم إلغاء السداد');
  const b=brOf(scope());
  dbDo(db.from('itqan_payments').insert({student_id:sid,month:V.month,amount:b.monthly_fee}),'تم تسجيل السداد ✓');
}

RV.people=()=>{
  const b=scope();
  const staff=rk()==='association'?`<div class="card"><h3>المدراء وأمين الصندوق</h3>
    <div class="tw"><table><tr><th>الاسم</th><th>الصفة</th><th>الفرع</th></tr>
    ${PEOPLE.map(p=>`<tr><td>${esc(p.full_name)}</td><td>${ROLE_LABEL[p.role]||''}</td><td>${esc(brOf(p.branch_id)?.name||'—')}</td></tr>`).join('')||'<tr><td colspan="3" class="note">لا توجد حسابات بعد</td></tr>'}
    </table></div></div>`:'';
  if(!b) return staff+noB();
  return staff+`<div class="card"><h3>معلمو ${esc(brOf(b)?.name||'')}</h3>
    <div class="row"><input id="tName" placeholder="اسم المعلم"><input id="tPhone" placeholder="الهاتف"><button class="b g" onclick="addTeacher()">إضافة معلم</button></div>
    <div class="tw" style="margin-top:10px"><table><tr><th>المعلم</th><th>الهاتف</th><th>الحلقات</th><th>عدد الطلاب</th></tr>
    ${TE.filter(t=>t.branch_id===b).map(t=>{const hh=HA.filter(x=>x.teacher_id===t.id);const n=ST.filter(s=>hh.some(x=>x.id===s.halaqa_id)).length;
      return `<tr><td>${esc(t.full_name)}</td><td>${esc(t.phone||'')}</td><td>${hh.map(x=>esc(x.name)).join('، ')||'—'}</td><td>${n}</td></tr>`;}).join('')
      ||'<tr><td colspan="4" class="note">لا يوجد معلمون بعد</td></tr>'}
    </table></div></div>`;
};

function addTeacher(){
  const n=$('tName').value.trim();
  if(!n) return msg('اكتب اسم المعلم');
  dbDo(db.from('itqan_teachers').insert({branch_id:scope(),full_name:n,phone:$('tPhone').value.trim()||null}),'تمت إضافة المعلم ✓');
}

RV.reports=()=>{
  const rows=BR.map(b=>{
    const ss=ST.filter(s=>s.branch_id===b.id);
    const paid=ss.filter(s=>PY.some(p=>p.student_id===s.id&&p.month===V.month)).length;
    const coll=PY.filter(p=>p.month===V.month&&ss.some(s=>s.id===p.student_id)).reduce((a,p)=>a+Number(p.amount||0),0);
    return `<tr><td>${esc(b.name)}</td><td>${HA.filter(h=>h.branch_id===b.id).length}</td><td>${TE.filter(t=>t.branch_id===b.id).length}</td>
      <td>${ss.length}</td><td>${ss.filter(s=>s.gender==='boy').length}</td><td>${ss.filter(s=>s.gender==='girl').length}</td>
      <td>${ss.filter(s=>s.admission_paid).length}</td><td>${paid}</td><td>${ss.length-paid}</td><td>${coll}</td></tr>`;
  }).join('');
  return `<div class="card"><div class="row"><h3 style="margin:0">تقرير شامل</h3>
    <label>الشهر: <input type="month" value="${V.month}" onchange="setV('month',this.value)"></label></div></div>
    <div class="tw"><table><tr><th>الفرع</th><th>الحلقات</th><th>المعلمون</th><th>الطلاب</th><th>بنين</th><th>بنات</th><th>قبول مسدد</th><th>سدّد الشهر</th><th>لم يسدّد</th><th>المحصّل</th></tr>
    ${rows||'<tr><td colspan="10" class="note">لا توجد فروع بعد</td></tr>'}</table></div>`;
};

async function logout(){
  await db.auth.signOut();
  location.reload();
}

db.auth.getSession().then(({data})=>{ if(data.session) enter(); });
