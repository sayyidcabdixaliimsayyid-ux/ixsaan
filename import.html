<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استيراد الطلاب من Excel</title>
<style>
body{font-family:Tahoma,Cairo,sans-serif;background:#fdf6e6;color:#2a1d0a;margin:0;padding:16px;line-height:1.6}
h1{color:#1b6b3a;font-size:22px}
.card{background:#fff;border:1px solid #e8d3a2;border-radius:12px;padding:14px;margin:10px 0}
input{font:inherit;padding:8px;border:1px solid #e8d3a2;border-radius:8px;margin:4px;max-width:100%}
button{font:inherit;background:#1b6b3a;color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;margin:4px}
button.s{background:#f7941d;color:#3a2400}
button:disabled{opacity:.4}
table{border-collapse:collapse;width:100%;min-width:440px}
th,td{border-bottom:1px solid #e8d3a2;padding:6px;text-align:start;font-size:14px}
th{background:#fbb040}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:#fff3d6}
tr.clickable.active td{background:#ffe7a8;font-weight:700}
.tw{overflow-x:auto}
.hidden{display:none!important}
.msg{color:#b3261e;min-height:22px;font-weight:700}
.ok{color:#1b6b3a;font-weight:700}
.note{color:#6b5a3e;font-size:14px}
.warn{color:#8a6100;font-weight:700}
.tag-new{color:#1b6b3a;font-weight:700}
.tag-old{color:#6b5a3e}
</style>
</head>
<body>
<h1>استيراد الطلاب من ملف Excel</h1>
<div><a href="admin.html">العودة إلى صفحة الإدارة</a></div>

<div id="loginBox" class="card">
  <h3>تسجيل الدخول</h3>
  <input id="email" type="email" placeholder="البريد الإلكتروني">
  <input id="pass" type="password" placeholder="كلمة المرور">
  <button onclick="doLogin()">دخول</button>
  <div id="loginMsg" class="msg"></div>
</div>

<div id="panel" class="hidden">
  <div class="note" id="who"></div>
  <div id="msg" class="msg"></div>

  <div class="card">
    <h3>1) اختر ملف Excel</h3>
    <p class="note">الملف يُقرأ داخل متصفحك، ولا يُرفع إلى أي مكان قبل الحفظ.</p>
    <input type="file" id="file" accept=".xlsx,.xls" onchange="onFile(event)">
  </div>

  <div class="card hidden" id="previewCard">
    <h3>2) المعاينة</h3>
    <div id="summary" class="note"></div>
    <p class="note">اضغط على اسم أي فصل لعرض طلابه.</p>
    <div class="tw"><table>
      <tr><th>الفصل</th><th>في الملف</th><th>مكرر داخل الملف</th><th>موجود مسبقاً</th><th>سيُضاف</th></tr>
      <tbody id="previewList"></tbody>
    </table></div>
    <div id="unknownBox" class="warn"></div>
  </div>

  <div class="card hidden" id="detailCard">
    <div class="row" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap">
      <h3 id="detailTitle" style="margin:6px 0"></h3>
      <button class="s" onclick="closeDetail()">إغلاق</button>
    </div>
    <div id="detailSummary" class="note"></div>
    <div class="tw"><table>
      <tr><th>م</th><th>اسم الطالب</th><th>الحالة</th></tr>
      <tbody id="detailList"></tbody>
    </table></div>
  </div>

  <div class="card hidden" id="saveCard">
    <h3>3) الحفظ</h3>
    <button id="saveBtn" onclick="saveAll()">حفظ الطلاب في النظام</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
